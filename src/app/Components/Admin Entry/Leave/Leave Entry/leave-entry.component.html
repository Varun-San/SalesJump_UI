<div *ngIf="isLeaveEntry" class="card shadow p-3 p-md-4 p-lg-3" id="isLeaveEntry">
    <div class="card-header bg-white border-0 p-0 mb-2 mb-md-3 d-flex align-items-center flex-wrap">
        <h5 class="mb-0 me-2 fs-5 fs-md-4">Add Leave Entry</h5>
        <div class="flex-grow-1 min-w-0">
            <hr class="mt-3 mt-md-2 mb-0" />
        </div>
    </div>

    <div class="card-body p-0 mt-1">
        <div class="row col-12">
            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">Division</label>
                    <ng-select [(ngModel)]="formData.selectDivision" [items]="selectDivisionList" bindLabel="name"
                        placeholder="Select Division" [searchable]="true">
                    </ng-select>
                </div>
            </div>

            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">Field Force <span class="text-danger">*</span></label>
                    <ng-select [(ngModel)]="formData.selectFieldForce" [items]="selectFieldForceList" bindLabel="name"
                        placeholder="Select Field Force" [searchable]="true">
                    </ng-select>
                </div>
            </div>

            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">Leave Type <span class="text-danger">*</span></label>
                    <ng-select [(ngModel)]="formData.selectLeaveType" [items]="selectLeaveTypeList" bindLabel="name"
                        placeholder="Select Leave Type" [searchable]="true">
                    </ng-select>
                </div>
            </div>

            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">Leave Option <span class="text-danger">*</span></label>
                    <ng-select [(ngModel)]="formData.selectLeaveOption" [items]="selectLeaveOptionList" bindLabel="name"
                        placeholder="Select Leave Type" [searchable]="true">
                    </ng-select>
                </div>
            </div>

            <div class="col-4">
                <label class="form-label">From <span class="text-danger">*</span></label>
                <mat-form-field appearance="outline" class=" w-100">
                    <input matInput [matDatepicker]="cal" [(ngModel)]="formData.fromDate">
                    <!-- Custom calendar icon, click opens the datepicker -->
                    <img src="Assets/AddCurrency/Calendar.svg" alt="Calendar Icon" (click)="cal.open()"
                        class="calendar-icon" />
                    <mat-datepicker #cal></mat-datepicker>
                </mat-form-field>
            </div>

            <div class="col-4">
                <label class="form-label">To <span class="text-danger">*</span></label>
                <mat-form-field appearance="outline" class=" w-100">
                    <input matInput [matDatepicker]="cal2" [(ngModel)]="formData.toDate">
                    <!-- Custom calendar icon, click opens the datepicker -->
                    <img src="Assets/AddCurrency/Calendar.svg" alt="Calendar Icon" (click)="cal2.open()"
                        class="calendar-icon" />
                    <mat-datepicker #cal2></mat-datepicker>
                </mat-form-field>
            </div>

            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">No. Of Days</label>
                    <input type="text" class="form-control" [(ngModel)]="formData.noofDays" />
                </div>
            </div>

            <div class="col-8">
                <div class="mb-3">
                    <label class="form-label">Reason <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" [(ngModel)]="formData.reason" />
                </div>
            </div>
        </div>
        <div class="col-12 mt-2">
            <button class="btn btn-primary" style="width: 70px;">Save</button>
        </div>
    </div>
</div>
