<div *ngIf="isAddHeadquartersRoute" class="card shadow p-4" id="Add-Division">
    <div class="row">
        <!-- Left Column (Drag Zone) -->
        <div class="col-12 col-sm-6 col-md-6 border_right column-1" (drop)="onFileDrop($event)"
            (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
            [ngClass]="{ 'drag-active-column': isDragging }" style="position: relative;">

            <div class="d-flex flex-column justify-content-center align-items-center p-4">

                <h5 class="mb-2">Upload File</h5>
                <p class="mb-2">Only .xlsx, .xls and .csv file types are supported</p>

                <input type="file" hidden #fileInput (change)="onFileSelected($event)" accept=".xlsx,.xls,.csv" />

                <button class="btn btn-primary d-flex align-items-center gap-2 mt-3" (click)="fileInput.click()">
                    <span>
                        <img src="Assets/LayoutIcons/Upload.svg" alt="Upload Icon" width="24" height="24">
                    </span>
                    Upload or Drop File
                </button>

                <div class="mt-2 text-black d-flex align-items-center gap-2" *ngIf="uploadedFileName">
                    <strong style="color: #1997ce;">Selected:</strong> {{ uploadedFileName }}
                    <span role="button" (click)="removeFile()" style="cursor: pointer;" title="Remove file">
                        <img src="Assets/LayoutIcons/Delete.svg" alt="Delete Icon" class="mb-1" width="24"
                            height="24" />
                    </span>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-6 d-flex flex-column" style="height: 77vh;">
            <div>
                <div class="card-header bg-white border-0 p-0 mb-2 d-flex align-items-center mb-3">
                    <h5 class="mb-0 me-2">Select Sheet & Table</h5>
                    <div class="flex-grow-1">
                        <hr class="mt-3 mb-0" />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sheet Name</label>
                    <ng-select [(ngModel)]="formData.selectDivision" [items]="divisionOptions"
                        [placeholder]="'Select a Sheet'" [searchable]="true" (change)="onSheetSelect($event)">
                    </ng-select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Choose Table</label>
                    <ng-select [(ngModel)]="formData.tableOption" [items]="tableOptions"
                        [placeholder]="'Select a Table'" [searchable]="true">
                    </ng-select>
                </div>

                <div *ngIf="formData.selectDivision" class="mt-3">
                    <div class="card-header bg-white border-0 p-0 mb-2 d-flex align-items-center mb-4">
                        <h5 class="mb-0 me-2">Upload File Details</h5>
                        <div class="flex-grow-1">
                            <hr class="mt-3 mb-0" />
                        </div>
                    </div>

                    <h6 class="mb-2">Preview: {{ formData.selectDivision }}</h6>

                    <div class="table-responsive table-master">
                        <table class="table table-bordered table-sm text-center align-middle"
                            *ngIf="selectedSheetData.length > 0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ellipsis" *ngFor="let col of selectedSheetData[0]">{{ col }}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="ellipsis" *ngFor="let row of selectedSheetData.slice(1)">
                                    <td class="ellipsis" *ngFor="let cell of row">{{ cell }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <div class="mt-auto">
                <div class="card-header bg-white border-0 p-0 mb-2 d-flex align-items-center">
                    <h5 class="mb-0 me-2">Excel Format & Fields</h5>
                    <div class="flex-grow-1">
                        <hr class="mt-3 mb-0" />
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Choose Table</label>
                    <ng-select [(ngModel)]="formData.tableOption_Download" [items]="tableOptions_download"
                        [placeholder]="'Select a Table'" [searchable]="true">
                    </ng-select>
                </div>
                <div class="d-flex justify-content-start gap-2 mt-3">
                    <button (click)="downloadFile()" class="btn btn-outline-secondary">Download</button>
                </div>
            </div>
        </div>
    </div>
</div>
