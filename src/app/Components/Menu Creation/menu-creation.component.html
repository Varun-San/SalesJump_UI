<div class="row page_left">
    <!-- Top Section -->
    <div class="col-12 mt-3">
        <div class="d-flex align-items-center justify-content-end">
            <!-- Search -->
            <div class="col-9 d-flex align-items-center gap-3">
                <div class="position-relative col-4">
                    <fa-icon [icon]="faSearch" class="search-icon"></fa-icon>
                    <input type="text" class="form-control ps-5" placeholder="Search" />
                </div>
            </div>

            <!-- Add Button -->
            <div class="col-3 d-flex justify-content-end align-item-end">
                <button class="btn filter-btn d-flex align-items-center justify-content-center "
                    style="background-color: #1997ce; color: white !important"
                    [routerLink]="['/menu-creation/add-menu']" routerLinkActive="router-link-active">
                    <img src="Assets/AdminMasters/Add.svg" alt="Add Icon" height="16" width="16" class="me-2" />
                    Menu
                </button>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="col-12 mt-3">
        <table class="table table-bordered">
            <colgroup>
                <col style="width: 1%;" />
                <col style="width: 5%;" />
                <col style="width: 10%;" />
                <col style="width: 15%;" />
                <col style="width: 10%;" />
                <col style="width: 20%;" />
                <col style="width: 10%;" />
                <col style="width: 15%;" />
                <col style="width: 1%;" />
            </colgroup>
            <thead class="table-light">
                <tr>
                    <th class="text-center">
                        <div class="form-check d-flex justify-content-center">
                            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                        </div>
                    </th>
                    <th>Sl.No</th>
                    <th>Menu_ID</th>
                    <th>Menu Name</th>
                    <th>Menu Type</th>
                    <th>Link_URL</th>
                    <th>Menu_Icon</th>
                    <th>Parent Menu</th>
                    <th class="text-center">
                        <div>
                            <img src="Assets/AdminMasters/Dashboard.svg" alt="Dashboard" height="25" width="25" />
                        </div>
                    </th>
                </tr>
            </thead>

            <tbody>
                <ng-container *ngIf="menus && menus.length > 0; else noMenus">
                    <tr *ngFor="let menu of menus; let i = index">
                        <td>
                            <div class="form-check d-flex justify-content-center">
                                <input class="form-check-input" type="checkbox" [value]="menu.menuName" />
                            </div>
                        </td>
                        <td>{{ i + 1 | number:'2.0' }}</td>
                        <td class="custom-td">{{ 'Menu_' + (menus.length - i + 90) }}</td>
                        <td class="custom-td">{{ menu.menuName }}</td>
                        <td class="custom-td">{{ menu.menuType }}</td>
                        <td>-</td>
                        <td>{{ menu.menuIcon }}</td>
                        <td>-</td>
                        <td class="align-middle">
                            <div class="d-flex justify-content-center">
                                <button mat-icon-button [matMenuTriggerFor]="menuOptions" aria-label="Menu Button">
                                    <img src="Assets/Menu.svg" alt="menu" />
                                </button>
                            </div>
                        </td>
                        <mat-menu #menuOptions="matMenu">
                            <button mat-menu-item (click)="editMenu(menu, i)">Edit</button>
                            <button mat-menu-item>Delete</button>
                            <button mat-menu-item>Option 3</button>
                        </mat-menu>
                    </tr>
                </ng-container>

                <ng-template #noMenus>
                    <tr>
                        <td colspan="9" class="text-center text-muted">
                            No menus found. Please add new menu entries.
                        </td>
                    </tr>
                </ng-template>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="9" class="text-start fw-bold">
                        Total Records: 3
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
